<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Muscle Up — Fat Down</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div id="app-shell" class="app-shell">
        
        <!-- Splash Screen -->
        <section id="splash-screen" class="screen active">
            <div class="splash-content">
                <div class="logo-area">
                    <h1 class="fade-in">MUSCLE UP</h1>
                    <h1 class="accent-text slide-up">FAT DOWN</h1>
                    <div class="badge-home">AT HOME!</div>
                </div>
                <div class="loader-container">
                    <div class="spinner"></div>
                    <p>developed by Ubaidjutt</p>
                </div>
            </div>
        </section>

        <!-- Desktop Sidebar (Immersive UI Theme) -->
        <aside id="sidebar-nav" class="sidebar">
            <div class="brand-logo" onclick="App.navigateTo('home')" style="cursor: pointer;">
                MUSCLE <span class="brand-accent">UP</span>
            </div>
            <nav class="sidebar-menu">
                <a class="nav-item active" data-screen="home">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    <span>Dashboard</span>
                </a>
                <a class="nav-item" data-screen="levels">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    <span>Difficulty Levels</span>
                </a>
                <a class="nav-item" data-screen="plan">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span>28-Day Plan</span>
                </a>
                <a class="nav-item" data-screen="tracker">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    <span>Analytics</span>
                </a>
                <a class="nav-item" data-screen="profile">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    <span>Profile</span>
                </a>
            </nav>
            <div class="user-profile" onclick="App.navigateTo('profile')">
                <div class="avatar" id="sidebar-avatar">U</div>
                <div class="user-profile-info">
                    <div class="user-name" id="sidebar-user-name">Alex Thorne</div>
                    <div class="user-level" id="sidebar-user-level">Beginner Level</div>
                </div>
            </div>
        </aside>

        <!-- Auth Modal (Hidden by default) -->
        <div id="auth-modal" class="modal">
            <div class="modal-content glass">
                <span class="close-modal">&times;</span>
                <div class="auth-tabs">
                    <button class="auth-tab active" data-tab="login">Login</button>
                    <button class="auth-tab" data-tab="register">Register</button>
                </div>
                <form id="auth-form">
                    <div id="register-fields" class="hidden">
                        <input type="text" id="auth-name" placeholder="Full Name">
                        <input type="number" step="0.1" id="auth-weight" placeholder="Current Weight (lb)">
                    </div>
                    <input type="email" id="auth-email" placeholder="Email" required>
                    <div class="password-wrapper">
                        <input type="password" id="auth-password" placeholder="Password" required>
                        <i class="fas fa-eye toggle-password"></i>
                    </div>
                    <button type="submit" id="auth-submit-btn" class="btn-primary" style="width: 100%; background: var(--accent-red); color: #fff;">Continue</button>
                </form>
            </div>
        </div>

        <!-- Main Content Area -->
        <main id="main-content" class="hidden">
            <!-- Dynamic Screens injected here via app.js -->
            <div id="screen-container"></div>
        </main>

        <!-- Bottom Navigation (Mobile Viewports) -->
        <nav id="bottom-nav" class="hidden">
            <div class="nav-item active" data-screen="home">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </div>
            <div class="nav-item" data-screen="levels">
                <i class="fas fa-layer-group"></i>
                <span>Levels</span>
            </div>
            <div class="nav-item" data-screen="plan">
                <i class="fas fa-calendar-alt"></i>
                <span>Plan</span>
            </div>
            <div class="nav-item" data-screen="tracker">
                <i class="fas fa-chart-line"></i>
                <span>Tracker</span>
            </div>
            <div class="nav-item" data-screen="profile">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </div>
        </nav>

    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <script src="/js/firebase-config.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
